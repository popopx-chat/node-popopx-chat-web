# ---------------------------------------------------------------------------
# node.popopx.chat -- POPOPX "Mac Node" product portal (static Vite + React build)
#
# What this file is: one plain nginx http-context config for a directory of
# static files. Nothing here proxies, rewrites to another origin, pulls from a
# CDN, loads a remote font/script, or reports anything to a third party. The
# site's iron rule is zero third-party tracking and zero external CDN; the only
# outbound request a browser makes is https://api.github.com/... for the
# download button, and connect-src below is the single place that is allowed.
#
# Shape: two server blocks, deliberately NOT two copies of the same site.
#
#   :80  serves exactly one thing -- the ACME HTTP-01 challenge files -- and
#        redirects everything else to HTTPS. It carries no content, no cache
#        policy and no CSP, because there is nothing for those to apply to.
#   :443 IS the site.
#
# This is why there is no shared `include` fragment here: with the plain-HTTP
# block reduced to a redirect, the only directives that would have been
# duplicated are gone, and one file stays diffable against the deployed copy.
#
# Requirements: nginx >= 1.9.5. HTTP/2 is enabled with the
# `listen … 443 ssl http2;` parameter form on purpose: every build from 1.9.5 to
# current accepts it, whereas the standalone `http2 on;` directive only exists
# from 1.25.1 -- and the production host for this site runs nginx 1.14.1, where
# `http2 on;` is an `[emerg] unknown directive` that fails `nginx -t` for the
# WHOLE machine config, not just this vhost. On nginx >= 1.25.1, `nginx -t`
# prints a deprecation notice about the parameter form; it is harmless.
# `deploy/centos/deploy_centos.sh` checks `nginx -v` and refuses to install a
# vhost the local build cannot parse.
#
# Install path (this is what deploy_centos.sh does, with a backup + nginx -t):
#   this file -> /etc/nginx/conf.d/node.popopx.chat.conf
# Web root (the contents of `dist/`, published by the same script):
#   /var/www/node.popopx.chat
#
# There is no HTTP-only variant of this file, and that is deliberate: a block
# that redirects to HTTPS is a loop the moment no certificate exists. Bootstrap
# instead gets its own throwaway server (ACME only, no redirect) generated by
# the script, so the certificate is obtained before this file is installed.
#
# Cache model, and why it looks like this:
#   /assets/*    content-hashed by Vite (index-<hash>.js, <locale>-<hash>.js)
#                -> safe to mark immutable for a year; a new deploy always
#                   changes both the filename and index.html.
#   index.html   NOT hashed -> must be revalidated on every load, otherwise a
#                deploy stays invisible until the browser cache expires.
#   root files   favicon.png / favicon-32.png / apple-touch-icon.png /
#                logo-popopx.png / logo-popopx.svg / site.webmanifest have
#                stable names -> short cache plus must-revalidate.
#
# nginx gotcha this file works around: `add_header` does NOT inherit into a
# block that declares its own `add_header`. Every location below that sets
# Cache-Control therefore re-declares the four security headers, using the
# short variable form so the long policy string exists exactly once per server.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# HTTP: ACME challenge only, everything else moves to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen                          80;
    listen                          [::]:80;
    server_name                     node.popopx.chat;

    root                            /var/www/node.popopx.chat;
    charset                         utf-8;
    server_tokens                   off;

    # Let's Encrypt / certbot --webroot writes here. `^~` makes this prefix win
    # over the dotfile denial below, so challenges stay reachable on port 80
    # while every other dotfile stays denied. Files land in
    # /var/www/node.popopx.chat/.well-known/acme-challenge/
    location ^~ /.well-known/acme-challenge/ {
        default_type                text/plain;
        try_files                   $uri =404;
    }

    location = /.well-known/acme-challenge/ {
        return                      404;
    }

    # 301, not 307: this portal is only ever fetched with GET/HEAD (see the
    # method guard in the HTTPS server), so there is no request body to preserve.
    location / {
        return                      301 https://$host$request_uri;
    }

    access_log                      /var/log/nginx/node.popopx.chat.http.access.log combined;
    error_log                       /var/log/nginx/node.popopx.chat.error.log warn;
}

# ---------------------------------------------------------------------------
# HTTPS: the static portal.
# ---------------------------------------------------------------------------
server {
    listen                          443 ssl http2;
    listen                          [::]:443 ssl http2;
    server_name                     node.popopx.chat;

    ssl_certificate                 /etc/letsencrypt/live/node.popopx.chat/fullchain.pem;
    ssl_certificate_key             /etc/letsencrypt/live/node.popopx.chat/privkey.pem;
    ssl_protocols                   TLSv1.2 TLSv1.3;
    ssl_ciphers                     ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers       off;
    ssl_session_cache               shared:POPOPX_TLS:10m;
    ssl_session_timeout             1d;

    # No OCSP stapling, on purpose: Let's Encrypt stopped serving OCSP in 2024
    # and removed the responders in 2025, so `ssl_stapling on` here buys nothing
    # and only adds a resolver dependency plus stapling errors in the log.
    # Certificate lifetime is handled by the certbot systemd timer instead.

    root                            /var/www/node.popopx.chat;
    index                           index.html;
    charset                         utf-8;
    server_tokens                   off;

    # Only GET/HEAD have meaning for a static portal; nothing here accepts a
    # body, so anything else is refused instead of being served an index.html.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # -----------------------------------------------------------------------
    # Compression. Explicit type list (no `gzip_types *`), mirroring the
    # operator's original set, plus application/manifest+json and text/javascript
    # so site.webmanifest and the JS chunks are compressed on every nginx build.
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # brotli needs the third-party ngx_brotli module, which is not in the distro
    # nginx package, so it is documented here rather than silently claimed:
    #   dnf install nginx-mod-brotli   # if your repo provides it
    #   load_module modules/ngx_http_brotli_filter_module.so;   # in the top-level context
    #   brotli on; brotli_comp_level 6;
    #   brotli_types text/css text/html application/javascript application/json image/svg+xml;

    # -----------------------------------------------------------------------
    # Security headers.
    #
    # frame-ancestors 'self' is the modern equivalent of X-Frame-Options
    # SAMEORIGIN; both are sent because the operator's original snippet sent
    # SAMEORIGIN and old clients still read it.
    #
    # This policy contains no 'unsafe-inline' anywhere, and that is a measured
    # claim, not an aspiration: the build emits one external
    # `<script type="module" crossorigin src="/assets/index-<hash>.js">`, zero
    # `style=` attributes, and `src/` uses no inline style objects and no
    # dangerouslySetInnerHTML. Re-check it after any change with:
    #   grep -rn 'style={{' src                      # must be 0
    #   grep -o 'style=' dist/index.html | wc -l     # must be 0
    # `upgrade-insecure-requests` IS included here and is correct on this server
    # only: on a plain-HTTP origin it makes the browser rewrite same-origin
    # http:// subresource URLs to https:// with no fallback, which is why it must
    # never appear in the port-80 block above.
    # -----------------------------------------------------------------------
    set $popopx_csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; upgrade-insecure-requests";

    add_header Content-Security-Policy  $popopx_csp                       always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header Referrer-Policy          "no-referrer"                     always;

    # Five minutes to start with. HSTS is a commitment to browsers you cannot
    # retract: raise it (63072000 = 2 years, plus includeSubDomains) only once
    # every real audience for this host has been proven to reach HTTPS.
    add_header Strict-Transport-Security "max-age=300" always;

    # Deny .git, .env, dotfiles from interrupted uploads and any other hidden
    # path. This is the rule that makes a stray `git clone` in the web root
    # merely broken instead of publicly downloadable -- but publishing only the
    # build output is what makes it impossible, see deploy_centos.sh.
    location ~ /\. {
        deny                            all;
        log_not_found                   off;
    }

    # Nothing in this build is executable: no PHP, no Python, no Node server, no
    # proxy. The list also covers the repository's own leftovers (.sh, .py) in
    # case a publish ever comes from a dirty directory, and the source-module
    # extensions (.ts, .tsx, ...) because that is exactly how this site last
    # broke: a clone was served raw, /src/main.tsx came back as
    # application/octet-stream, and the page was black. With these entries the
    # same mistake returns 404 instead of handing out the TypeScript. `return`
    # runs in the rewrite phase, before the access phase where `deny` is
    # evaluated, so 404 is what a client actually sees; `deny all` stays as the
    # statement of intent for anyone who reads the access log instead of the
    # response code.
    location ~* \.(?:php|pl|py|cgi|sh|env|ini|lock|bak|old|swp|tsbuildinfo|ts|tsx|mts|cts|jsx)$ {
        deny                            all;
        return                          404;
        log_not_found                   off;
    }

    # -----------------------------------------------------------------------
    # Entry document: never cached. This is what makes a deploy visible on the
    # visitor's next load. Reached directly and, because the final argument of
    # try_files is an internal redirect, also for every SPA route.
    # -----------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control            "no-cache, must-revalidate"   always;
        add_header Content-Security-Policy  $popopx_csp                   always;
        add_header X-Frame-Options          "SAMEORIGIN"                  always;
        add_header X-Content-Type-Options   "nosniff"                     always;
        add_header Referrer-Policy          "no-referrer"                 always;
    }

    # -----------------------------------------------------------------------
    # Hashed chunks (entry bundle, CSS, and the 20 lazy locale chunks that are
    # fetched when a visitor switches language). One year, immutable.
    # A single Cache-Control header is emitted instead of `expires 1y` +
    # `add_header Cache-Control`, which would send two conflicting ones.
    # `try_files ... =404` matters more than it looks: without it a missing
    # chunk would fall through to index.html, arrive as text/html, and the
    # browser would refuse to execute it -- a black page, not an error.
    # -----------------------------------------------------------------------
    location ^~ /assets/ {
        try_files                       $uri =404;

        add_header Cache-Control        "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy  $popopx_csp                   always;
        add_header X-Frame-Options          "SAMEORIGIN"                  always;
        add_header X-Content-Type-Options   "nosniff"                     always;
        add_header Referrer-Policy          "no-referrer"                 always;
    }

    # -----------------------------------------------------------------------
    # Web app manifest: correct media type even on nginx builds whose
    # mime.types predates the .webmanifest entry, and revalidated every load.
    # -----------------------------------------------------------------------
    location = /site.webmanifest {
        default_type                    application/manifest+json;

        add_header Cache-Control        "no-cache, must-revalidate"       always;
        add_header Content-Security-Policy  $popopx_csp                   always;
        add_header X-Frame-Options          "SAMEORIGIN"                  always;
        add_header X-Content-Type-Options   "nosniff"                     always;
        add_header Referrer-Policy          "no-referrer"                 always;
    }

    # Root-level favicons and logos: stable filenames, so 7 days plus
    # must-revalidate. The pattern is anchored to a single path segment, which
    # keeps /assets/ out of its way even if a future build emits hashed images.
    location ~* ^/[^/]+\.(?:png|jpe?g|gif|webp|svg|ico)$ {
        add_header Cache-Control        "public, max-age=604800, must-revalidate" always;
        add_header Content-Security-Policy  $popopx_csp                   always;
        add_header X-Frame-Options          "SAMEORIGIN"                  always;
        add_header X-Content-Type-Options   "nosniff"                     always;
        add_header Referrer-Policy          "no-referrer"                 always;
    }

    # Browsers that ignore the <link rel="icon"> tags still ask for this one.
    location = /favicon.ico {
        try_files                       /favicon.png =404;
        log_not_found                   off;
    }

    # -----------------------------------------------------------------------
    # SPA fallback. /node, /install, /security, /troubleshooting, /releases and
    # any other client-side route serve index.html; $uri/ keeps a real directory
    # index reachable if one is added. This is also what answers /badge and
    # /badge?app=desktop|android: the router resolves an unmatched path to the
    # overview and never reads the query string.
    # -----------------------------------------------------------------------
    location / {
        try_files                       $uri $uri/ /index.html;
    }

    access_log                          /var/log/nginx/node.popopx.chat.access.log combined;
    error_log                           /var/log/nginx/node.popopx.chat.error.log warn;
}
