# ---------------------------------------------------------------------------
# node.popopx.chat -- POPOPX "Mac Node" product portal (static Vite + React build)
#
# What this file is: one plain nginx http-context config for a directory of
# static files. Nothing here proxies, rewrites to another origin, pulls from a
# CDN, loads a remote font/script, or reports anything to a third party. The
# site's iron rule is zero third-party tracking and zero external CDN; the only
# outbound request a browser makes is https://api.github.com/... for the
# download button, and connect-src below is the single place that is allowed.
#
# Install path (this is what deploy_centos.sh does, with a backup + nginx -t):
#   this file -> /etc/nginx/conf.d/node.popopx.chat.conf
# Web root (build output of `npm run build`, staged by the same script):
#   /var/www/node.popopx.chat
#
# Cache model, and why it looks like this:
#   /assets/*    content-hashed by Vite (index-<hash>.js, <locale>-<hash>.js)
#                -> safe to mark immutable for a year; a new deploy always
#                   changes both the filename and index.html.
#   index.html   NOT hashed -> must be revalidated on every load, otherwise a
#                deploy stays invisible until the browser cache expires.
#   root files   favicon.png / favicon-32.png / apple-touch-icon.png /
#                logo-popopx.png / logo-popopx.svg / site.webmanifest have
#                stable names -> short cache plus must-revalidate.
#
# nginx gotcha this file works around: `add_header` does NOT inherit into a
# block that declares its own `add_header`. Every location below that sets
# Cache-Control therefore re-declares the four security headers, using the
# short variable form so the long policy string exists exactly once per server.
# ---------------------------------------------------------------------------

server {
    listen                          80;
    listen                          [::]:80;
    server_name                     node.popopx.chat;

    root                            /var/www/node.popopx.chat;
    index                           index.html;
    charset                         utf-8;
    server_tokens                   off;

    # Only GET/HEAD have meaning for a static portal; nothing here accepts a
    # body, so anything else is refused instead of being served an index.html.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # -----------------------------------------------------------------------
    # Compression. Explicit type list (no `gzip_types *`), mirroring the
    # operator's original set, plus application/manifest+json and text/javascript
    # so site.webmanifest and the JS chunks are compressed on every nginx build.
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Security headers. frame-ancestors 'self' is the modern equivalent of
    # X-Frame-Options SAMEORIGIN; both are sent because the operator's original
    # snippet sent SAMEORIGIN and old clients still read it.
    #
    # upgrade-insecure-requests is deliberately NOT in the plain-HTTP policy:
    # per the Upgrade Insecure Requests spec (section 4.1 step 5 and the
    # "Failed Upgrade" example) a browser honoring this directive rewrites
    # same-origin http:// subresource URLs to https:// with no fallback, so
    # sending it before a certificate is installed would break every /assets/
    # request. It is included in the commented 443 server block at the bottom,
    # where it is correct.
    # -----------------------------------------------------------------------
    set $popopx_csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'";

    add_header Content-Security-Policy  $popopx_csp                       always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header Referrer-Policy          "no-referrer"                     always;

    # -----------------------------------------------------------------------
    # Let's Encrypt / ACME HTTP-01. `^~` makes this prefix win over the regex
    # dotfile block below, so challenges stay reachable on port 80 while every
    # other dotfile stays denied. Files land in
    # /var/www/node.popopx.chat/.well-known/acme-challenge/
    # -----------------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        default_type    text/plain;
        try_files       $uri =404;
    }

    # Deny .git, .env, deploy leftovers and any other dotfile.
    location ~ /\. {
        deny            all;
        log_not_found   off;
    }

    # -----------------------------------------------------------------------
    # Entry document: never cached. This is what makes a deploy visible on the
    # visitor's next load. Reached directly and, because the final argument of
    # try_files is an internal redirect, also for every SPA route.
    # -----------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control            "no-cache, must-revalidate"   always;
        add_header Content-Security-Policy  $popopx_csp                   always;
        add_header X-Frame-Options          "SAMEORIGIN"                  always;
        add_header X-Content-Type-Options   "nosniff"                     always;
        add_header Referrer-Policy          "no-referrer"                 always;
    }

    # -----------------------------------------------------------------------
    # Hashed chunks (entry bundle, CSS, and the 17 lazy locale chunks that are
    # fetched when a visitor switches language). One year, immutable.
    # A single Cache-Control header is emitted instead of `expires 1y` +
    # `add_header Cache-Control`, which would send two conflicting ones.
    # -----------------------------------------------------------------------
    location ^~ /assets/ {
        try_files       $uri =404;

        add_header Cache-Control            "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy  $popopx_csp                   always;
        add_header X-Frame-Options          "SAMEORIGIN"                  always;
        add_header X-Content-Type-Options   "nosniff"                     always;
        add_header Referrer-Policy          "no-referrer"                 always;
    }

    # -----------------------------------------------------------------------
    # Web app manifest: correct media type even on nginx builds whose
    # mime.types predates the .webmanifest entry, and revalidated every load.
    # -----------------------------------------------------------------------
    location = /site.webmanifest {
        default_type    application/manifest+json;

        add_header Cache-Control            "no-cache, must-revalidate"   always;
        add_header Content-Security-Policy  $popopx_csp                   always;
        add_header X-Frame-Options          "SAMEORIGIN"                  always;
        add_header X-Content-Type-Options   "nosniff"                     always;
        add_header Referrer-Policy          "no-referrer"                 always;
    }

    # Root-level favicons and logos: stable filenames, so 7 days plus
    # must-revalidate. The pattern is anchored to a single path segment, which
    # keeps /assets/ out of its way even if a future build emits hashed images.
    location ~* ^/[^/]+\.(?:png|jpe?g|gif|webp|svg|ico)$ {
        add_header Cache-Control            "public, max-age=604800, must-revalidate" always;
        add_header Content-Security-Policy  $popopx_csp                   always;
        add_header X-Frame-Options          "SAMEORIGIN"                  always;
        add_header X-Content-Type-Options   "nosniff"                     always;
        add_header Referrer-Policy          "no-referrer"                 always;
    }

    # Browsers that ignore the <link rel="icon"> tags still ask for this one.
    location = /favicon.ico {
        try_files       /favicon.png =404;
        log_not_found   off;
    }

    # -----------------------------------------------------------------------
    # SPA fallback. /pricing, /download and any other client-side route serve
    # index.html; $uri/ keeps a real directory index reachable if one is added.
    # -----------------------------------------------------------------------
    location / {
        try_files       $uri $uri/ /index.html;
    }
}

